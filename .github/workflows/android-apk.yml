name: Android APK

# Builds the side-loadable MediDiary APK.
#  • every push / pull request → unit tests + APK artifact (downloadable from the run page)
#  • push a tag like v1.0.0      → also publishes a GitHub Release with the APK attached (direct link for judges)
# Model files (Whisper / Gemma) are never part of the APK; see README "Model files".

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write # only used by the Release step on v* tags
    env:
      NDK_VERSION: "27.2.12479018"
      CMAKE_VERSION: "3.22.1"
      HAS_KEYSTORE: ${{ secrets.MEDIDIARY_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout (with whisper.cpp + llama.cpp submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Install NDK, CMake and SDK platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          ls "$ANDROID_HOME/ndk"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="1.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "MEDIDIARY_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "Version name: $V, version code: $GITHUB_RUN_NUMBER"

      # whisper.cpp + llama.cpp take most of the build time; reuse CMake outputs when sources are unchanged.
      - name: Native cache key
        id: native
        run: echo "sub=$(git submodule status | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache native (.cxx) builds
        uses: actions/cache@v6
        with:
          path: |
            app/.cxx
            whisper/.cxx
            llama/.cxx
          key: cxx-${{ env.NDK_VERSION }}-${{ steps.native.outputs.sub }}-${{ hashFiles('app/src/main/cpp/**', 'whisper/src/main/cpp/**', 'llama/src/main/cpp/**', 'app/build.gradle.kts', 'whisper/build.gradle.kts', 'llama/build.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            cxx-${{ env.NDK_VERSION }}-${{ steps.native.outputs.sub }}-

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Decode release keystore (optional)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MEDIDIARY_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/medidiary-release.jks"
          echo "MEDIDIARY_KEYSTORE_FILE=$RUNNER_TEMP/medidiary-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          MEDIDIARY_KEYSTORE_PASSWORD: ${{ secrets.MEDIDIARY_KEYSTORE_PASSWORD }}
          MEDIDIARY_KEY_ALIAS: ${{ secrets.MEDIDIARY_KEY_ALIAS }}
          MEDIDIARY_KEY_PASSWORD: ${{ secrets.MEDIDIARY_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK (no network permission, native libs, signature)
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "## MediDiary APK" >> "$GITHUB_STEP_SUMMARY"

          "$BT/aapt2" dump permissions "$APK" | tee permissions.txt
          if grep -qE "android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)" permissions.txt; then
            echo "::error::Network permission found in the APK — MediDiary must stay 100% offline."
            exit 1
          fi

          for lib in libmedidiary_whisper.so libmedidiary_llama.so; do
            unzip -l "$APK" | grep -q "lib/arm64-v8a/$lib" || { echo "::error::$lib missing from APK"; exit 1; }
          done

          "$BT/apksigner" verify --print-certs "$APK" | tee signing.txt
          OUT="MediDiary-${MEDIDIARY_VERSION_NAME}.apk"
          cp "$APK" "$OUT"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"
          {
            echo "| | |"; echo "|---|---|"
            echo "| File | \`$OUT\` |"
            echo "| Size | $(du -h "$OUT" | cut -f1) |"
            echo "| SHA-256 | \`$(sha256sum "$OUT" | cut -d' ' -f1)\` |"
            echo "| Version | ${MEDIDIARY_VERSION_NAME} (code ${GITHUB_RUN_NUMBER}) |"
            echo "| Signing | $([ "$HAS_KEYSTORE" = true ] && echo 'release key (secrets)' || echo 'CI debug key — uninstall before installing a newer build') |"
            echo "| Network permissions | none ✅ |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.APK_PATH }}
          archive: false # download the .apk directly, not a zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7

      - name: Publish GitHub Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
          body: |
            **MediDiary ${{ env.MEDIDIARY_VERSION_NAME }}** — offline, bilingual (Bangla + English) health diary.

            Install: download the APK below on an arm64 Android 8+ phone and allow "Install unknown apps".
            The on-device AI models are not included in the APK (size). Load them via **Settings → Load model**:
            `medidiary-whisper.bin` (Whisper, ggml) and `medidiary-gemma.gguf` (Gemma 3 1B, GGUF). See the README.

            Patient-Reported & AI-Assisted, Not Medically Verified.
